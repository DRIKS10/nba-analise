name: Pre-live NBA

# Roda 1x por dia, de manhã (ver seção 2 do spec-prelive-nba.md), bem antes
# dos jogos de hoje começarem. Diferente do monitor.yml (halftime), um atraso
# de 30-60 minutos aqui não prejudica nada — por isso usamos só o
# agendamento nativo do GitHub, sem precisar do cron-job.org.
#
# 13h30 UTC = 10h30 em Brasília (UTC-3).
on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba "Actions" do GitHub, para testar

# Evita que duas execuções do pre-live rodem ao mesmo tempo (seção 2).
concurrency:
  group: prelive-nba
  cancel-in-progress: false

jobs:
  prelive:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar as bibliotecas do projeto
        run: pip install -r requirements.txt

      - name: Rodar o pre-live
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python -m src.prelive_main
