name: Monitorar jogos da NBA

# "on.schedule" diz ao GitHub para rodar este workflow sozinho, em horários
# fixos, sem ninguém precisar clicar em nada. Os horários de cron são sempre
# em UTC (horário de Brasília = UTC - 3h).
#
# Janela desejada: ~12h às 04h30/05h (Brasília) = ~15h às 07h50 (UTC),
# atravessando a meia-noite UTC — por isso duas linhas de cron.
on:
  schedule:
    - cron: "*/5 15-23 * * *"  # 12h00 às 20h55 (Brasília)
    - cron: "*/5 0-7 * * *"    # 21h00 às 04h55 (Brasília, já no dia seguinte em UTC)
  workflow_dispatch: {}         # permite rodar manualmente pela aba "Actions" do GitHub, para testar

# Nota de revisão (bug real corrigido, em duas partes): impede que duas
# execuções rodem ao mesmo tempo. Como há dois gatilhos ativos (cron-job.org
# + o agendamento nativo do GitHub como reforço, cada um a cada 5 minutos),
# duas execuções concorrentes já causaram perda real de dados — a função que
# expande a planilha (add_rows) lê o tamanho atual e manda "definir" um novo
# tamanho; se duas execuções fazem isso ao mesmo tempo, a que termina por
# último pode encolher a planilha de volta, apagando linhas que a outra
# tinha acabado de escrever, sem erro nenhum.
#
# A primeira versão desta correção (só "concurrency", sem "queue: max") foi
# incompleta e criou um problema NOVO: por padrão, o GitHub só permite UMA
# execução esperando na fila por vez — se uma nova tentativa chegasse
# enquanto já tinha outra esperando, a mais antiga era CANCELADA (nunca
# chegava a rodar), mesmo com cancel-in-progress em false (que só protege a
# execução que já está RODANDO, não as que estão na fila). Como os dois
# gatilhos disparam a cada 5 minutos, isso cancelava execuções com
# frequência, piorando bastante o problema de 1º tempo perdido e de jogos
# só gravados horas/dias depois. "queue: max" permite várias execuções
# esperarem na fila (em vez de se cancelarem), mantendo a garantia de nunca
# rodar duas ao mesmo tempo.
concurrency:
  group: monitor-nba
  cancel-in-progress: false
  queue: max

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar as bibliotecas do projeto
        run: pip install -r requirements.txt

      - name: Rodar o sistema
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python -m src.main
